<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="CYBERPUNK EDGERUNNERS backdrop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b24"/>
      <stop offset="100%" stop-color="#c4d600"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.62">
      <stop offset="0%" stop-color="#ff3f8e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff3f8e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="35%" stop-color="#000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(1180 420) scale(1.7)">
      <g fill="none" stroke="#ff3f8e" opacity="0.55">
        <ellipse cx="300" cy="330" rx="250" ry="88" transform="rotate(-24 300 330)"/>
        <ellipse cx="300" cy="330" rx="210" ry="66" transform="rotate(18 300 330)"/>
        <ellipse cx="300" cy="330" rx="290" ry="120" transform="rotate(-6 300 330)" opacity="0.5"/>
      </g>
      <circle cx="300" cy="330" r="58" fill="#ff3f8e" opacity="0.9"/></g>
  <rect width="1600" height="900" filter="url(#grain)"/>
  <rect width="1600" height="900" fill="url(#fade)"/>
  <g fill="#f6f2e9" font-family="ui-sans-serif, Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="760" font-size="26" font-weight="700" letter-spacing="7" opacity="0.8">POPCORN</text>
    <text x="90" y="820" font-size="18" letter-spacing="4" opacity="0.6">SERIES · 10 EPISODES</text>
  </g>
</svg>