<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="SICARIO backdrop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b140d"/>
      <stop offset="100%" stop-color="#9a6a3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.62">
      <stop offset="0%" stop-color="#f3d6a2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3d6a2" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="35%" stop-color="#000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g transform="translate(1180 420) scale(1.7)">
      <circle cx="452" cy="250" r="126" fill="#f3d6a2" opacity="0.9"/>
      <g stroke="#f3d6a2" opacity="0.35">
        <line x1="40" y1="700" x2="560" y2="700" stroke-width="1"/>
        <line x1="40" y1="732" x2="560" y2="732" stroke-width="1"/>
        <line x1="40" y1="764" x2="560" y2="764" stroke-width="1"/>
      </g></g>
  <rect width="1600" height="900" filter="url(#grain)"/>
  <rect width="1600" height="900" fill="url(#fade)"/>
  <g fill="#f6f2e9" font-family="ui-sans-serif, Inter, Helvetica, Arial, sans-serif">
    <text x="90" y="760" font-size="26" font-weight="700" letter-spacing="7" opacity="0.8">POPCORN</text>
    <text x="90" y="820" font-size="18" letter-spacing="4" opacity="0.6">THRILLER · 121 MIN</text>
  </g>
</svg>