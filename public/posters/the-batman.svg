<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-label="THE BATMAN poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0708"/>
      <stop offset="100%" stop-color="#6e1417"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#e8a0a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8a0a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#glow)"/>
  
      <g fill="none" stroke="#e8a0a0" opacity="0.55">
        <ellipse cx="300" cy="330" rx="250" ry="88" transform="rotate(-24 300 330)"/>
        <ellipse cx="300" cy="330" rx="210" ry="66" transform="rotate(18 300 330)"/>
        <ellipse cx="300" cy="330" rx="290" ry="120" transform="rotate(-6 300 330)" opacity="0.5"/>
      </g>
      <circle cx="300" cy="330" r="58" fill="#e8a0a0" opacity="0.9"/>
  <rect width="600" height="900" filter="url(#grain)" opacity="0.9"/>
  <rect width="600" height="900" fill="url(#fade)"/>
  <g fill="#f6f2e9" font-family="ui-sans-serif, Inter, Helvetica, Arial, sans-serif">
    <text x="56" y="74" font-size="20" font-weight="700" letter-spacing="5" opacity="0.85">POPCORN</text>
    <text x="544" y="74" font-size="16" letter-spacing="3" text-anchor="end" opacity="0.7">2022</text>
    <text x="56" y="476" font-size="80" font-weight="800" letter-spacing="-2"><tspan x="56" dy="0">THE</tspan><tspan x="56" dy="78.4">BATMAN</tspan></text>
    <text x="58" y="824" font-size="15" letter-spacing="3.5" opacity="0.78">CRIME · 176 MIN</text>
  </g>
  <rect x="56" y="850" width="44" height="3" fill="#e8a0a0"/>
</svg>